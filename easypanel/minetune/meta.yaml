schema:
  type: object
  required:
    - serviceName
    - version
    - memoryLimit
  properties:
    serviceName:
      type: string
      title: Service Name
      default: minetune
    version:
      type: string
      title: Minetune Version
      default: "0.3.1"
    memoryLimit:
      type: string
      title: Minecraft Server Memory Limit
      description: >-
        Maximum memory for the Minecraft container (for example 4g or 6g). Keep
        about 1 GB above the heap set later in the panel.
      default: 6g
