name: Minetune
description: >-
  Minetune is a Minecraft Java server stack with its own web panel in English,
  Portuguese and Spanish. Pick Paper, Purpur, Fabric, NeoForge or Vanilla and the
  version from the official lists, manage players, game rules, plugins and mods
  from Modrinth and multiple worlds, and keep incremental, encrypted backups with
  restic on local disk, Cloudflare R2 or any S3 storage. Every player creates a
  password for their name in a window inside the game, with no plugin or mod, so
  nobody can join with someone else's name.
instructions: >-
  Open TCP port 25565 in your server firewall (and UDP 19132 if you turn on
  Bedrock crossplay). The panel opens on this service's domain; log in with
  PANEL_PASSWORD from the Environment tab. Save RESTIC_PASSWORD somewhere safe,
  outside the server: backups can't be restored without it.
changeLog:
  - date: 2026-09-15
    description: First release (Minetune 0.3.1)
links:
