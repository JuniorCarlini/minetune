# =============================================================================
# minetune — stack com imagens publicadas, para plataformas sem o código-fonte
#
# Use quando não dá para clonar o repositório: colar no EasyPanel (serviço Compose),
# Portainer, Coolify ou qualquer host com Docker. Em casa ou numa VPS com o repositório,
# continue com o compose.yaml da raiz e o `make up`.
#
# Diferenças para o compose.yaml da raiz:
#   - imagens ghcr.io/juniorcarlini/minetune-* (entrypoints e configuração inicial dentro)
#   - nada montado a partir de arquivos do repositório
#   - a pasta de config é gravável no servidor: na primeira subida ele copia os padrões
#
# Variáveis obrigatórias (gere cada uma com `openssl rand -base64 32`):
#   RCON_PASSWORD, PANEL_PASSWORD, PANEL_SESSION_SECRET, RESTIC_PASSWORD
# As demais têm padrão; veja .env.example no repositório.
# =============================================================================

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restic-env: &restic-env
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:?defina RESTIC_PASSWORD (openssl rand -base64 32) e guarde fora do servidor}
  RESTIC_HOST: ${INSTANCE_NAME:-minetune}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}

services:
  mc:
    image: ghcr.io/juniorcarlini/minetune-mc:${MINETUNE_VERSION:-0.3.2}
    labels:
      minetune.instance: ${INSTANCE_NAME:-minetune}
      minetune.role: server
    environment:
      EULA: "TRUE"
      TZ: ${TZ:-America/Sao_Paulo}
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?defina RCON_PASSWORD (openssl rand -base64 32)}
      CREATE_CONSOLE_IN_PIPE: "true"
      ENABLE_ROLLING_LOGS: "true"
      STOP_SERVER_ANNOUNCE_DELAY: "5"
      STOP_DURATION: "60"
      # Heap inicial do Minecraft (ex.: 3G) quando a máquina tem pouca RAM. Vazio = padrão 4G.
      # Vale só na primeira subida; mantenha ~1 GB abaixo de MC_MEMORY_LIMIT.
      MINETUNE_INITIAL_MEMORY: ${MINETUNE_INITIAL_MEMORY:-}
      # Atrás do Portão Minetune: o Paper aceita só quem chega por ele.
      MINETUNE_GATE: "true"
    ports:
      # A porta do jogo (TCP) é do portão; aqui só o Bedrock, usado quando o crossplay está ligado.
      - "${BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${CONFIG_DIR:-./config}:/minetune/config
    mem_limit: ${MC_MEMORY_LIMIT:-6g}
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    restart: unless-stopped
    logging: *logging
    networks: [game]

  gate:
    # Portão Minetune: recebe os jogadores e pede a senha do nick antes de ligar cada um ao servidor.
    image: ghcr.io/juniorcarlini/minetune-panel:${MINETUNE_VERSION:-0.3.2}
    command: ["node", "src/server/gate/index.ts"]
    labels:
      minetune.instance: ${INSTANCE_NAME:-minetune}
      minetune.role: gate
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GATE_BACKEND: mc:25565
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD}
    ports:
      # O jogo não é HTTP: a porta sai direto no host (domínios HTTPS da plataforma não servem aqui).
      - "${MC_PORT:-25565}:25565/tcp"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${CONFIG_DIR:-./config}:/minetune/config:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    mem_limit: 128m
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *logging
    networks: [game]

  backup:
    image: ghcr.io/juniorcarlini/minetune-backup:${MINETUNE_VERSION:-0.3.2}
    labels:
      minetune.instance: ${INSTANCE_NAME:-minetune}
      minetune.role: backup
    depends_on:
      mc:
        condition: service_healthy
    environment:
      <<: *restic-env
      TZ: ${TZ:-America/Sao_Paulo}
      BACKUP_METHOD: restic
      BACKUP_NAME: world
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD}
      INITIAL_DELAY: ${BACKUP_INITIAL_DELAY:-5m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-6h}
      PAUSE_IF_NO_PLAYERS: ${BACKUP_PAUSE_IF_NO_PLAYERS:-true}
      PRUNE_RESTIC_RETENTION: ${BACKUP_RETENTION:---keep-last 4 --keep-daily 7 --keep-weekly 4 --keep-monthly 6}
      EXCLUDES: ${BACKUP_EXCLUDES:-/data/*.jar,/data/libraries,/data/versions,/data/cache,/data/logs,/data/.minetune,*.tmp}
      RESTIC_LIMIT_UPLOAD: ${RESTIC_LIMIT_UPLOAD:-0}
      RESTIC_CACHE_DIR: /cache
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
      - ${BACKUP_LOCAL_DIR:-./backups}:/backups
      - restic-cache:/cache
      - ${CONFIG_DIR:-./config}:/minetune/config:ro
    restart: unless-stopped
    logging: *logging
    networks: [game]

  panel:
    image: ghcr.io/juniorcarlini/minetune-panel:${MINETUNE_VERSION:-0.3.2}
    labels:
      minetune.instance: ${INSTANCE_NAME:-minetune}
      minetune.role: panel
    depends_on:
      - docker-proxy
    environment:
      <<: *restic-env
      TZ: ${TZ:-America/Sao_Paulo}
      INSTANCE_NAME: ${INSTANCE_NAME:-minetune}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?defina PANEL_PASSWORD (mínimo 8 caracteres)}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:?defina PANEL_SESSION_SECRET (openssl rand -base64 32)}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      MC_PORT: ${MC_PORT:-25565}
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD}
      DOCKER_API: http://docker-proxy:2375
      BACKUP_NAME: world
      BACKUP_EXCLUDES: ${BACKUP_EXCLUDES:-/data/*.jar,/data/libraries,/data/versions,/data/cache,/data/logs,/data/.minetune,*.tmp}
      BACKUP_RETENTION: ${BACKUP_RETENTION:---keep-last 4 --keep-daily 7 --keep-weekly 4 --keep-monthly 6}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-6h}
      BACKUP_PAUSE_IF_NO_PLAYERS: ${BACKUP_PAUSE_IF_NO_PLAYERS:-true}
      RESTIC_LIMIT_UPLOAD: ${RESTIC_LIMIT_UPLOAD:-0}
      RESTIC_CACHE_DIR: /cache
    # Sem porta no host: a plataforma (EasyPanel, proxy reverso) aponta o domínio HTTPS para panel:8080.
    # Num host sem proxy, descomente para abrir só nesta máquina.
    # ports:
    #   - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${CONFIG_DIR:-./config}:/config
      - ${BACKUP_LOCAL_DIR:-./backups}:/backups
      - restic-cache:/cache
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    restart: unless-stopped
    logging: *logging
    networks: [game, docker-api]

  docker-proxy:
    image: wollomatic/socket-proxy:1
    command:
      - -loglevel=WARN
      - -listenip=0.0.0.0
      - -allowfrom=panel
      - -allowGET=^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs|stats))$$
      - -allowPOST=^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|restart)$$
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: ${DOCKER_PROXY_USER:-0:0}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
    networks: [docker-api]

networks:
  game: {}
  docker-api:
    internal: true

volumes:
  restic-cache: {}
